aid: liftopia
name: Liftopia
description: Liftopia is a consumer marketplace for advance-purchase ski and snowboard lift tickets,
  letting travelers browse and buy discounted day tickets and multi-day passes at hundreds of ski areas
  across the United States, Canada, Europe, South America, Japan, Australia and New Zealand. The site
  is organized by region, state and destination with dated availability and 1-8 day ticket search, and
  carries an affiliate program for partners. Liftopia's engineering organization operates on GitHub as
  Catalate Commerce, Inc., and the site footer points to Spotlio. As of this profile Liftopia publishes
  no public developer portal, API documentation, OpenAPI definition or client SDKs.
